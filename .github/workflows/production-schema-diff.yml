name: Production Schema Diff

on:
  workflow_dispatch:

jobs:
  production-schema-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CI: "true"
      # Read-only introspection source. Schema also requires DIRECT_URL env name;
      # map the same DATABASE_URL secret only (no DIRECT_URL secret, no URL echo).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Production schema diff (read-only)
        id: prod_diff
        shell: bash
        run: |
          set +e
          npx cross-env NODE_OPTIONS=--dns-result-order=ipv4first prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prod-schema-diff.sql 2>prod-schema-diff.err
          code=$?

          echo "exit_code=${code}"

          if [ -s prod-schema-diff.err ]; then
            # Scrub connection strings if Prisma echoes a host/URL
            sed -E 's#postgres(ql)?://[^[:space:]\"'\'']+#\[REDACTED\]#gi' prod-schema-diff.err | tail -n 30
          fi

          if [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi

          bytes=$(wc -c < prod-schema-diff.sql | tr -d ' ')
          echo "diff_byte_size=${bytes}"
          exit 0

      - name: Upload diff artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prod-schema-diff
          path: prod-schema-diff.sql
          if-no-files-found: error
          retention-days: 14
