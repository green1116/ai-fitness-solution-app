name: Production Migration Execution

on:
  workflow_dispatch:

jobs:
  production-migration-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      # Direct Postgres only. Never use secrets.DATABASE_URL.
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Production migration execution
        shell: bash
        run: |
          set -euo pipefail
          export DATABASE_URL="$DIRECT_URL"
          export DIRECT_URL="$DIRECT_URL"

          scrub() {
            sed -E 's#postgres(ql)?://[^[:space:]\"'\'']+#\[REDACTED\]#gi'
          }

          # 1) assert pending migrations are within allowed set (retirement + lead_indexes + budget_label)
          set +e
          npx cross-env NODE_OPTIONS=--dns-result-order=ipv4first prisma migrate status \
            >predeploy-status.out 2>predeploy-status.err
          set -e
          if [ -s predeploy-status.err ]; then scrub <predeploy-status.err >&2; fi

          grep -E '^[[:space:]]*[0-9]{14}_[A-Za-z0-9_]+[[:space:]]*$' predeploy-status.out \
            | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' \
            | sort > pending.actual
          printf '%s\n' \
            '20260826154500_production_legacy_schema_retirement' \
            '20260826170000_lead_indexes_alignment' \
            '20260901083000_project_budget_label' \
            | sort > pending.expected

          if [ ! -s pending.actual ]; then
            echo "pending_migrations_mismatch: no pending migrations"
            exit 1
          fi
          if comm -23 pending.actual pending.expected | grep -q .; then
            echo "pending_migrations_mismatch: unexpected pending migration(s)"
            echo "allowed:"
            cat pending.expected
            echo "actual:"
            cat pending.actual
            exit 1
          fi

          # 2) deploy pending (allowed migrations only)
          set +e
          npx cross-env NODE_OPTIONS=--dns-result-order=ipv4first prisma migrate deploy \
            >deploy.out 2>deploy.err
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            scrub <deploy.err >&2 || true
            exit "$code"
          fi

          # 3) migrate status (printed)
          set +e
          npx cross-env NODE_OPTIONS=--dns-result-order=ipv4first prisma migrate status \
            >status.out 2>status.err
          code=$?
          set -e
          if [ -s status.err ]; then scrub <status.err >&2; fi
          scrub <status.out
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          # 4) migrate diff — fail if non-empty
          set +e
          npx cross-env NODE_OPTIONS=--dns-result-order=ipv4first prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script > prod-exec-diff.sql 2>prod-exec-diff.err
          code=$?
          set -e
          if [ -s prod-exec-diff.err ]; then scrub <prod-exec-diff.err >&2; fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi

          bytes=$(wc -c < prod-exec-diff.sql | tr -d ' ')
          echo "final_diff_byte_size=${bytes}"

          if grep -Eq '^[[:space:]]*-- This is an empty migration\.[[:space:]]*$' prod-exec-diff.sql \
            || [ ! -s prod-exec-diff.sql ]; then
            exit 0
          fi

          # Non-empty residual schema drift
          exit 1
